<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <p class="subtitle">
            Python Flask Student Management System
        </p>


        <div class="card">

            <h2>Add Student</h2>

            <form action="/add" method="POST">

                <input
                    type="number"
                    name="id"
                    placeholder="Student ID"
                    required
                >

                <input
                    type="text"
                    name="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="number"
                    name="age"
                    placeholder="Age"
                    required
                >

                <input
                    type="text"
                    name="course"
                    placeholder="Course"
                    required
                >

                <button type="submit">
                    Add Student
                </button>

            </form>

        </div>


        <div class="card">

            <h2>Student Records</h2>

            <table>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Action</th>

                </tr>


                {% for student in students %}

                <tr>

                    <td>{{ student[0] }}</td>

                    <td>{{ student[1] }}</td>

                    <td>{{ student[2] }}</td>

                    <td>{{ student[3] }}</td>

                    <td>

                        <a
                            href="/delete/{{ student[0] }}"
                            class="delete"
                        >
                            Delete
                        </a>

                    </td>

                </tr>

                {% endfor %}

            </table>

        </div>

    </div>

</body>

</html>
